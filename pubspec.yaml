  file_picker: ^13.1.0
  image_picker: ^1.2.3
  flutter_svg: ^2.3.0
  cached_network_image: ^4.0.0
  photo_view: ^0.15.0
  url_launcher: ^6.3.2
  syncfusion_flutter_charts: ^32.2.7
  syncfusion_flutter_signaturepad: ^32.2.7
  syncfusion_flutter_sliders: ^32.2.7
  path_provider: ^2.1.6
  path: ^1.9.1
  internet_connection_checker_plus: ^3.1.2
  http: ^1.6.0
  http_parser: ^4.1.2
  mime: ^2.1.0
  dio: ^5.11.1
